[package]
name = "tansu-server"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
# `--host 0.0.0.0` の時に、このマシンのネットワークインターフェースの IP を `Host` の許可リストに足すために列挙する
if-addrs.workspace = true
serde.workspace = true
serde_json.workspace = true
tansu-core.workspace = true
# 待ち受け (`net`) と、axum のサーバーを動かす runtime (`rt`) に要る
tokio = { workspace = true, features = ["net", "rt"] }

[dev-dependencies]
tempfile.workspace = true
# 統合テストの #[tokio::test] (current_thread) に要る
tokio = { workspace = true, features = ["macros", "rt"] }
# router に 1 リクエストずつ渡す `ServiceExt::oneshot` に要る
tower = { workspace = true, features = ["util"] }
