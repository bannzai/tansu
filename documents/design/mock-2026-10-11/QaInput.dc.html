<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>tansu QA の入力</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#ffffff;color:#1b1b1f;font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px}
a{color:#2b4ea8}a:hover{color:#1e3a85}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 820px; background: #ffffff">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #e1e3e8">
    <a href="Main.dc.html" style="text-decoration: none; color: #2b4ea8">← item</a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">QA の入力</h1>
    <span style="color: #5a5f6b">bannzai/Focus / billing</span>
    <div style="flex: 1 1 120px"></div>
    <label style="display: flex; align-items: center; gap: 6px; color: #5a5f6b">検証環境 <input value="iPhone 17 Pro / iOS 27.1" style="border: 1px solid #c9ccd4; border-radius: 6px; padding: 6px 8px; font: inherit; color: #1b1b1f; width: 200px"></label>
    <span style="color: #5a5f6b">commit 7cea89d</span>
  </header>
  <main style="flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; max-width: 1100px; width: 100%; box-sizing: border-box; margin: 0 auto">
    <section style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; align-items: baseline; gap: 12px">
        <span style="font-size: 28px; font-weight: 700; color: #2b4ea8">{{current.no}}</span>
        <h2 style="margin: 0; font-size: 22px; font-weight: 700">{{current.name}}</h2>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="display: inline-block; padding: 2px 8px; border-radius: 4px; background: #eef2fb; color: #2b4ea8; font-size: 12px">課金</span>
        <span style="display: inline-block; padding: 2px 8px; border-radius: 4px; background: #f3f4f7; color: #5a5f6b; font-size: 12px">manual: 実機の購入シートが要る</span>
      </div>
      <div style="border: 1px solid #e1e3e8; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <div style="font-weight: 500; color: #5a5f6b">手で見ること</div>
        <div>{{current.expected}}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-weight: 500; color: #5a5f6b">結果</div>
        <div style="display: flex; gap: 8px">
          <button onClick="{{pickOk}}" style="flex: 1 1 0; min-height: 48px; border-radius: 8px; border: 2px solid {{okBorder}}; background: {{okBg}}; color: {{okColor}}; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">OK</button>
          <button onClick="{{pickNg}}" style="flex: 1 1 0; min-height: 48px; border-radius: 8px; border: 2px solid {{ngBorder}}; background: {{ngBg}}; color: {{ngColor}}; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">NG</button>
          <button onClick="{{pickLater}}" style="flex: 1 1 0; min-height: 48px; border-radius: 8px; border: 2px solid {{laterBorder}}; background: {{laterBg}}; color: {{laterColor}}; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">あとで</button>
        </div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-weight: 500; color: #5a5f6b">メモ</span>
        <textarea rows="4" placeholder="気づいたことや NG の再現手順" style="border: 1px solid #c9ccd4; border-radius: 8px; padding: 10px; font: inherit; resize: vertical"></textarea>
      </label>
      <div style="display: flex; gap: 8px">
        <button onClick="{{prev}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #c9ccd4; background: #ffffff; font: inherit; color: #1b1b1f; cursor: pointer">← 前</button>
        <button onClick="{{next}}" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #2b4ea8; color: #ffffff; font: inherit; font-weight: 500; cursor: pointer">記録して次へ →</button>
      </div>
    </section>
    <aside style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="font-weight: 500; color: #5a5f6b">この feature の項目</div>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <button onClick="{{it.jump}}" style="display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid {{it.border}}; background: {{it.bg}}; border-radius: 8px; padding: 10px 12px; font: inherit; color: #1b1b1f; cursor: pointer; min-height: 44px">
          <span style="width: 22px; color: #9094a0">{{it.no}}</span>
          <span style="flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.name}}</span>
          <span style="font-size: 12px; font-weight: 700; color: {{it.resultColor}}">{{it.result}}</span>
        </button>
      </sc-for>
    </aside>
  </main>
  <footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 24px; border-top: 1px solid #e1e3e8; background: #f7f8fa">
    <span style="font-weight: 700">{{doneCount}} / {{total}} 件 入力済み</span>
    <span style="color: #1f7a4d">OK {{okCount}}</span>
    <span style="color: #b3261e">NG {{ngCount}}</span>
    <span style="color: #8a6d00">あとで {{laterCount}}</span>
    <span style="color: #5a5f6b">保存済み 19:22</span>
    <div style="flex: 1 1 80px"></div>
    <button style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #c9ccd4; background: #ffffff; font: inherit; color: #1b1b1f; cursor: pointer">入力を消す</button>
    <button style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #2b4ea8; background: #ffffff; font: inherit; color: #2b4ea8; font-weight: 500; cursor: pointer">全部コピー (未入力と NG を markdown で)</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      index: 1,
      results: { 0: "OK", 1: "NG" }
    };
  }
  renderVals() {
    const base = [
      { no: 1, name: "プレミアムの購入が完了する", expected: "購入のシートで購入を完了し、設定画面に「プレミアム」が表示される。機能の解放 (テーマの変更・上限の解除) が即座に効く" },
      { no: 2, name: "購入の復元ができる", expected: "アプリを削除して再インストールし、設定の「購入を復元」で解放状態が戻る" },
      { no: 3, name: "無料トライアルの残り日数が表示される", expected: "トライアル中は残り日数、終了後は購入の導線が出る" },
      { no: 4, name: "価格が地域の通貨で表示される", expected: "App Store の価格と同じ通貨・金額" },
      { no: 5, name: "購入をキャンセルしても画面が壊れない", expected: "シートが閉じ、未購入の状態のまま" },
      { no: 6, name: "期限切れ後に機能が戻る", expected: "サブスクリプションの期限が切れたら無料の状態に戻る" }
    ];
    const color = { OK: "#1f7a4d", NG: "#b3261e", "あとで": "#8a6d00" };
    const results = this.state.results;
    const index = this.state.index;
    const items = base.map((it, i) => ({
      ...it,
      result: results[i] ?? "",
      resultColor: color[results[i]] ?? "#9094a0",
      border: i === index ? "#2b4ea8" : "#e1e3e8",
      bg: i === index ? "#eef2fb" : "#ffffff",
      jump: () => this.setState({ index: i })
    }));
    const pick = (value) => () => this.setState({ results: { ...results, [index]: value } });
    const chosen = results[index];
    const style = (value, on) => ({
      border: chosen === value ? on : "#c9ccd4",
      bg: chosen === value ? on : "#ffffff",
      color: chosen === value ? "#ffffff" : "#1b1b1f"
    });
    const ok = style("OK", "#1f7a4d");
    const ng = style("NG", "#b3261e");
    const later = style("あとで", "#8a6d00");
    const counts = Object.values(results);
    return {
      current: base[index],
      items,
      pickOk: pick("OK"), pickNg: pick("NG"), pickLater: pick("あとで"),
      okBorder: ok.border, okBg: ok.bg, okColor: ok.color,
      ngBorder: ng.border, ngBg: ng.bg, ngColor: ng.color,
      laterBorder: later.border, laterBg: later.bg, laterColor: later.color,
      prev: () => this.setState({ index: Math.max(0, index - 1) }),
      next: () => this.setState({ index: Math.min(base.length - 1, index + 1) }),
      doneCount: counts.length,
      total: base.length,
      okCount: counts.filter((v) => v === "OK").length,
      ngCount: counts.filter((v) => v === "NG").length,
      laterCount: counts.filter((v) => v === "あとで").length
    };
  }
}
</script>
</body>
</html>
