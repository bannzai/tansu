name: E2E

# E2E は PR ごとの必須チェックにせず、画面を確かめたい時に gh workflow run e2e.yml --ref <ブランチ> で起動する
# (方針: bannzai/castle の setup-ci skill references/ci-design.md の 2。起票元: https://github.com/bannzai/castle/issues/2302 )
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fixtures/ の合成 QA.md を取り込んだ tansu serve を Playwright で操作し、各画面のスクリーンショットを
  # e2e-screenshots の artifact に上げる (AGENTS.md「検証」。画面の変更の証拠になる)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/.bun-version
      - run: bun install --frozen-lockfile --cwd web
      # tansu は web/dist をビルド時にバイナリへ埋め込む (crates/server/build.rs) ため、Rust より先に画面をビルドする
      - run: bun run --cwd web build
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p tansu-cli
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: bun run --cwd web test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-screenshots
          path: web/test-results/
          retention-days: 14
