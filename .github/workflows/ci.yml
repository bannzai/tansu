name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup --version
      # rustup 1.28 以降はアクティブな toolchain を自動でインストールしない。引数なしの `rustup toolchain install` で
      # rust-toolchain.toml の channel と components を入れ、Rust の版の定義をそのファイルの 1 箇所にする
      # (https://blog.rust-lang.org/2025/03/02/Rustup-1.28.0/ 「To ensure its installation, run `rustup toolchain install` with no arguments.」)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p tansu-cli
      # ビルドしたバイナリが起動することを確かめる
      - run: ./target/release/tansu --version

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/.bun-version
      - run: bun install --frozen-lockfile --cwd web
      - run: bun run --cwd web lint
      - run: bun run --cwd web typecheck
      - run: bun run --cwd web test
      - run: bun run --cwd web build
